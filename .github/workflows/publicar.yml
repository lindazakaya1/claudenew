name: Publicaciones programadas

# Revisa la cola cada media hora y despacha lo que ya venció.
# GitHub ejecuta los cron en UTC, pero la hora de cada publicación se compara
# usando la zona horaria de config.json, así que no hay que convertir nada.
#
# Por qué cada 30 minutos y no cada 10: en repositorios privados GitHub cobra
# las ejecuciones y factura un minuto mínimo por cada una. Cada 10 minutos
# serían unos 4.300 minutos al mes, muy por encima de los 2.000 gratuitos;
# cada 30 son unos 1.440 y caben de sobra. Si el repositorio es público las
# ejecuciones son ilimitadas y puedes bajarlo a "*/10 * * * *".

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publicaciones-programadas
  cancel-in-progress: false

jobs:
  despachar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependencias
        run: pip install -r requirements.txt

      - name: Despachar publicaciones vencidas
        id: despacho
        continue-on-error: true
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
        run: python -m programador ejecutar

      - name: Guardar el estado de la cola
        run: |
          if [ -z "$(git status --porcelain programados publicados)" ]; then
            echo "Sin cambios en la cola."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add programados publicados
          git commit -m "Actualizar cola de publicaciones"
          # Otra ejecución pudo haber movido la rama mientras tanto.
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"

      - name: Reflejar fallos del despacho
        if: steps.despacho.outcome == 'failure'
        run: |
          echo "Alguna publicación falló. Revisa el log y el campo ultimo_error." >&2
          exit 1
