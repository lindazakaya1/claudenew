name: Probar el buscador contra la galería

# Temporal: comprueba desde un servidor de GitHub (que sí alcanza
# pic-time.com) que el lector de la galería funciona de verdad.

on:
  workflow_dispatch:
  push:
    branches: [claude/web-photo-search-repbcg]
    paths: [buscafotos/pictime.py, .github/workflows/sonda.yml]

jobs:
  probar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: python -m pip install --quiet -r requirements.txt

      - name: Pruebas sin internet
        run: python -m unittest discover -s tests

      - name: Listar las carpetas de la galería real
        run: python -m buscafotos carpetas

      - name: Leer las fotos de cada carpeta juvenil
        run: |
          python - <<'PY'
          from buscafotos import ajustes, fuentes, imagenes

          datos = ajustes.cargar()
          carpetas = [c for c in fuentes.listar_carpetas(datos)
                      if "Juveniles" in c["nombre"]]
          print(f"{len(carpetas)} carpetas juveniles\n")

          total, buenas, primera = 0, [], None
          for carpeta in carpetas:
              try:
                  fotos = fuentes.listar_fotos(datos, carpeta)
              except fuentes.ErrorFuente as e:
                  print(f"  fallo  {carpeta['nombre']}\n           {e}")
                  continue
              total += len(fotos)
              buenas.append(carpeta)
              primera = primera or (fotos[0] if fotos else None)
              print(f"  {len(fotos):>5}  {carpeta['nombre']}")

          print(f"\n{len(buenas)} de {len(carpetas)} carpetas leídas, {total} fotos")

          assert primera, "ninguna carpeta devolvió fotos"
          print(f"\nBajando {primera['url']}")
          contenido, tipo = imagenes.preparar(primera)
          print(f"  {len(contenido)} bytes, {tipo}")
          assert contenido[:2] == b"\xff\xd8", "no es un JPEG"
          print("  es un JPEG de verdad")
          PY
