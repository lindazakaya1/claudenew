name: Sonda de la galería

# Ejecuta buscafotos/sonda.py desde un servidor de GitHub, que sí tiene acceso
# libre a internet, y deja el resultado en el registro de la ejecución.
# Es temporal: sirve para saber cómo está construida la galería de Pic-Time.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL base de la galería"
        required: false
        default: "https://macabeadaspty.pic-time.com"
  push:
    branches: [claude/web-photo-search-repbcg]
    paths: [buscafotos/sonda.py, .github/workflows/sonda.yml]

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Mirar la galería
        run: python buscafotos/sonda.py "${{ inputs.url || 'https://macabeadaspty.pic-time.com' }}"
