name: Sonda de la galería

# Temporal: corre buscafotos/sonda.py desde un servidor de GitHub, que sí
# alcanza pic-time.com, para averiguar cómo pide la galería sus datos.

on:
  workflow_dispatch:
  push:
    branches: [claude/web-photo-search-repbcg]
    paths: [buscafotos/sonda.py]

jobs:
  sondear:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python buscafotos/sonda.py "https://macabeadaspty.pic-time.com"
